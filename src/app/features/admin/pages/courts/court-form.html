<div class="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto p-4 py-10">
  <button
    type="button"
    class="absolute inset-0 bg-pitch/55"
    aria-label="Cerrar"
    (click)="close()"
  ></button>

  <section
    class="relative z-10 w-full max-w-xl rounded-3xl border border-line bg-sand p-5 shadow-2xl sm:p-6"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'court-dialog-title'"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-sm font-medium text-turf">Canchas</p>
        <h2 id="court-dialog-title" class="mt-1 text-2xl font-semibold tracking-tight">
          {{ isCreate ? 'Nueva cancha' : 'Editar cancha' }}
        </h2>
        <p class="mt-2 text-sm text-muted">
          Si la cancha ya tiene reservas, no se puede cambiar el bloque, el horario ni la zona.
        </p>
      </div>
      <button
        type="button"
        class="rounded-full p-2 text-muted hover:bg-white hover:text-ink"
        aria-label="Cerrar"
        (click)="close()"
      >
        <app-admin-icon name="close" class="text-lg" />
      </button>
    </div>

    @if (error()) {
      <p class="mt-4 rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">
        {{ error() }}
      </p>
    }

    <form class="mt-5 grid gap-4" [formGroup]="form" (ngSubmit)="save()" novalidate>
      <div>
        <label class="mb-1 block text-sm font-medium" for="court-name">Nombre</label>
        <input
          id="court-name"
          type="text"
          maxlength="128"
          formControlName="name"
          autofocus
          class="w-full rounded-xl border border-line bg-white px-3 py-2.5 outline-none focus:border-pitch"
        />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium" for="court-description">Descripción</label>
        <textarea
          id="court-description"
          rows="3"
          maxlength="512"
          formControlName="description"
          class="w-full rounded-xl border border-line bg-white px-3 py-2.5 outline-none focus:border-pitch"
        ></textarea>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-sm font-medium" for="court-slot">Bloque (min)</label>
          <select
            id="court-slot"
            formControlName="slot_minutes"
            class="w-full rounded-xl border border-line bg-white px-3 py-2.5 outline-none focus:border-pitch"
          >
            <option [ngValue]="60">60</option>
            <option [ngValue]="30">30</option>
          </select>
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium" for="court-price">Precio por hora</label>
          <input
            id="court-price"
            type="number"
            min="0"
            step="1000"
            formControlName="price_per_hour"
            class="w-full rounded-xl border border-line bg-white px-3 py-2.5 outline-none focus:border-pitch"
          />
        </div>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-sm font-medium" for="court-opens">Abre</label>
          <input
            id="court-opens"
            type="time"
            formControlName="opens_at"
            class="w-full rounded-xl border border-line bg-white px-3 py-2.5 outline-none focus:border-pitch"
          />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium" for="court-closes">Cierra</label>
          <input
            id="court-closes"
            type="time"
            formControlName="closes_at"
            class="w-full rounded-xl border border-line bg-white px-3 py-2.5 outline-none focus:border-pitch"
          />
        </div>
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1 block text-sm font-medium" for="court-tz">Zona horaria</label>
          <input
            id="court-tz"
            type="text"
            formControlName="timezone"
            class="w-full rounded-xl border border-line bg-white px-3 py-2.5 outline-none focus:border-pitch"
          />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium" for="court-status">Estado</label>
          <select
            id="court-status"
            formControlName="status"
            class="w-full rounded-xl border border-line bg-white px-3 py-2.5 outline-none focus:border-pitch"
          >
            <option ngValue="active">Activa</option>
            <option ngValue="inactive">Inactiva</option>
          </select>
        </div>
      </div>

      <div class="mt-2 flex flex-wrap justify-end gap-3">
        <button
          type="button"
          class="rounded-2xl px-4 py-2.5 text-sm font-medium text-muted hover:bg-white"
          (click)="close()"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="rounded-2xl bg-pitch px-4 py-2.5 text-sm font-semibold text-sand hover:bg-turf disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="saving()"
        >
          {{ saving() ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </form>
  </section>
</div>

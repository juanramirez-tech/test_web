<div
  class="w-full rounded-2xl border border-line bg-white p-4 shadow-sm sm:p-5"
  [class.pointer-events-none]="!store.court()"
  [class.opacity-60]="!store.court()"
>
  <div class="mb-4 flex items-center justify-between gap-3">
    <button
      type="button"
      class="flex size-9 items-center justify-center rounded-full border border-line text-pitch hover:bg-sand disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="!store.court() || !canPrev()"
      (click)="shift(-1)"
      aria-label="Mes anterior"
    >
      ‹
    </button>
    <p class="text-sm font-semibold">{{ title() }}</p>
    <button
      type="button"
      class="flex size-9 items-center justify-center rounded-full border border-line text-pitch hover:bg-sand disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="!store.court() || !canNext()"
      (click)="shift(1)"
      aria-label="Mes siguiente"
    >
      ›
    </button>
  </div>

  <div class="mb-2 grid grid-cols-7 text-center text-[11px] font-medium uppercase tracking-wide text-muted">
    @for (day of weekdays; track day) {
      <span class="py-1">{{ day }}</span>
    }
  </div>

  <div class="grid grid-cols-7 gap-1">
    @for (cell of cells(); track cell.ymd) {
      <button
        type="button"
        class="relative aspect-square rounded-xl text-sm transition"
        [disabled]="!store.court() || !cell.selectable"
        [attr.aria-pressed]="store.date() === cell.ymd"
        [attr.aria-current]="store.date() === cell.ymd ? 'date' : null"
        [class.bg-pitch]="store.date() === cell.ymd"
        [class.text-sand]="store.date() === cell.ymd"
        [class.text-ink]="store.date() !== cell.ymd && cell.inMonth && cell.selectable"
        [class.text-muted]="store.date() !== cell.ymd && (!cell.inMonth || !cell.selectable)"
        [class.opacity-40]="store.date() !== cell.ymd && !cell.selectable"
        [class.font-medium]="cell.inMonth"
        [class.hover:bg-lime]="cell.selectable && store.date() !== cell.ymd"
        [class.hover:text-ink]="cell.selectable && store.date() !== cell.ymd"
        (click)="pick(cell.ymd, cell.selectable)"
      >
        {{ cell.day }}
        @if (cell.ymd === today() && store.date() !== cell.ymd) {
          <span class="absolute inset-x-0 bottom-1 mx-auto size-1 rounded-full bg-turf"></span>
        }
      </button>
    }
  </div>

  <p class="mt-4 text-sm text-muted">
    @if (selectedLabel(); as label) {
      <span class="font-medium text-pitch">{{ label }}</span>
    } @else if (!store.court()) {
      Primero elige una cancha.
    } @else {
      Hoy hasta 30 días. Elige un día libre.
    }
  </p>
</div>

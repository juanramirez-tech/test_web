name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: browser-actions/setup-chrome@v1
      - name: Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build
